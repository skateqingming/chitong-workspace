services:
  - type: web
    name: chitong-workspace
    runtime: node
    plan: free
    buildCommand: ""
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATA_FILE
        value: /tmp/chitong-app.json
      - key: MAX_BODY_BYTES
        value: "1048576"
